---
# Tags the Caddy version pinned in caddy-pink/Dockerfile and publishes a GitHub
# release with generated notes.
#
# Version is derived, never stored separately: the Dockerfile is the source of
# truth and build.yml already publishes images under the same `v<version>` tag.
# Running after the build means the release is created only once the image it
# describes is actually published, on the same commit.

name: Release

on:
  workflow_run:
    workflows: [Build caddy-pink]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Tag and publish release
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout the built commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Create GitHub release for a new version
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          OWNER: ${{ github.repository_owner }}
          NAME: caddy-pink
        run: |
          set -euo pipefail
          version=$(grep -E '^ARG[[:space:]]+CADDY_VERSION=' caddy-pink/Dockerfile \
            | sed -E 's/^ARG[[:space:]]+CADDY_VERSION=([0-9]+\.[0-9]+\.[0-9]+).*$/\1/' | head -n1)
          tag="v$version"

          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "tag $tag already exists; nothing to release"
            exit 0
          fi

          # Pull the manifest digest anonymously, no registry credentials here.
          # A missing tag repeats the check a few times while the registry settles.
          digest=""
          for _ in 1 2 3 4 5 6; do
            tok=$(curl -fsS "https://auth.docker.io/token?service=registry.docker.io&scope=repository:$OWNER/$NAME:pull" | jq -r .token) || tok=""
            digest=$(curl -fsSI -H "Authorization: Bearer $tok" \
              -H 'Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json' \
              "https://registry-1.docker.io/v2/$OWNER/$NAME/manifests/$version" \
              | tr -d '\r' | awk 'tolower($1)=="docker-content-digest:"{print $2}')
            if [ -n "$digest" ]; then break; fi
            sleep 10
          done

          # Note range starts at the previous tag. The first release has none,
          # and the API rejects a commit SHA here, so omit it.
          prev=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 || true)
          range=()
          if [ -n "$prev" ]; then
            range=(--notes-start-tag "$prev")
          fi

          gh release create "$tag" \
            --target "$SHA" \
            --title "Caddy $version" \
            --generate-notes \
            "${range[@]}"

          # gh cannot append after generated notes, so add the image section in
          # a follow-up edit. Pull tags are immutable, so both registries share
          # one manifest digest.
          if [ -n "$digest" ]; then
            {
              gh release view "$tag" --json body --jq .body
              printf '\n## Container images\n\n```\ndocker.io/%s/%s:%s\nghcr.io/%s/%s:%s\n\nsha256:%s\n```\n' \
                "$OWNER" "$NAME" "$version" "$OWNER" "$NAME" "$version" "${digest#sha256:}"
            } > "$RUNNER_TEMP/body.md"
            gh release edit "$tag" --notes-file "$RUNNER_TEMP/body.md"
          else
            echo "::warning::Could not resolve image digest; release created without it"
          fi
