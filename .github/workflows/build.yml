# Workflow to build and push a Docker image to Docker Hub, GitHub and Quay Container Registries

name: Build caddy-pink

# Controls when the action will run
on:
  workflow_dispatch: # allows to run the workflow manually from the Actions tab

  push:
    branches: [main]
    paths:
      - caddy-pink/Dockerfile

# Environment variables available to all jobs and steps in this workflow
env:
  DOCKER_BUILDKIT: 1
  DOCKER_NAME: caddy-pink
  DOCKER_DESCRIPTION: "Caddy Docker custom build"

# Jobs to run once the workflow is triggered
jobs:
  # Job to get image and repository details
  metadata:
    name: Prepare build metadata and validate
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}
      labels: ${{ steps.metadata.outputs.labels }}
      tags: ${{ steps.metadata.outputs.tags }}
      platforms: linux/amd64,linux/arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main

      # Quick validation first
      - name: Validate Dockerfile exists
        run: |
          if [ ! -f "$DOCKER_NAME/Dockerfile" ]; then
            echo "ERROR: Dockerfile not found at $DOCKER_NAME/Dockerfile" >&2
            exit 1
          fi
          echo "✓ Dockerfile exists"

      - name: Parse Caddy version
        id: version
        run: |
          set -euo pipefail
          FILE="$DOCKER_NAME/Dockerfile"

          # Parse version with simplified logic
          ARG_VER=$(grep -E '^ARG[[:space:]]+CADDY_VERSION=' "$FILE" | sed -E 's/^ARG[[:space:]]+CADDY_VERSION=([0-9]+\.[0-9]+\.[0-9]+).*$/\1/' | head -n1 || true)

          if [ -z "${ARG_VER:-}" ]; then
            ARG_VER=$(grep -E '^FROM[[:space:]]+caddy:' "$FILE" | sed -E 's/^FROM[[:space:]]+caddy:([0-9]+\.[0-9]+\.[0-9]+).*$/\1/' | head -n1 || true)
          fi

          if [ -z "${ARG_VER:-}" ]; then
            echo "ERROR: Could not parse Caddy version from $FILE" >&2
            exit 1
          fi

          # Simple validation
          if ! echo "$ARG_VER" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "ERROR: Invalid version format: $ARG_VER" >&2
            exit 1
          fi

          echo "version=${ARG_VER}" >> $GITHUB_OUTPUT
          echo "✓ Parsed version: $ARG_VER"

      - name: Generate image metadata with Caddy version
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
        id: metadata
        with:
          images: |
            docker.io/${{ github.actor }}/${{ env.DOCKER_NAME }}
            ghcr.io/${{ github.actor }}/${{ env.DOCKER_NAME }}
          tags: |
            type=semver,pattern={{version}},value=v${{ steps.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ steps.version.outputs.version }}
            type=semver,pattern={{major}},value=v${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.title=${{ env.DOCKER_NAME }}
            org.opencontainers.image.description=${{ env.DOCKER_DESCRIPTION }}

  # Job to build and publish Docker image
  build:
    name: Build and publish Docker image
    runs-on: ubuntu-latest
    needs: metadata

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Login to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Repository
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and publish container image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        id: build
        with:
          context: .
          file: ./${{ env.DOCKER_NAME }}/Dockerfile
          push: true
          provenance: false
          tags: ${{ needs.metadata.outputs.tags }}
          labels: ${{ needs.metadata.outputs.labels }}
          platforms: ${{ needs.metadata.outputs.platforms }}
          # Buildx cache
          cache-from: type=gha
          cache-to: type=gha,mode=max
